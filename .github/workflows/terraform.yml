name: Terraform

on:
  push:
    branches: [main, stable, martin, benoit, charlie]
    paths:
      - "terraform/**"
      - "scripts/**"
      - "packages/control-plane/**"
      - "packages/slack-bot/**"
      - "packages/github-bot/**"
      - "packages/linear-bot/**"
      - "packages/modal-infra/**"
      - "packages/daytona-infra/**"
      - "packages/sandbox-runtime/**"
      - "packages/shared/**"
      - "packages/web/**" # Web app deployed via Terraform when web_platform = "cloudflare"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "scripts/**"
      - "packages/control-plane/**"
      - "packages/slack-bot/**"
      - "packages/github-bot/**"
      - "packages/linear-bot/**"
      - "packages/modal-infra/**"
      - "packages/daytona-infra/**"
      - "packages/sandbox-runtime/**"
      - "packages/shared/**"
      - "packages/web/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
          - martin
          - benoit
          - charlie

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false # Don't cancel terraform operations

env:
  TF_VERSION: "1.14.8"

jobs:
  resolve-target:
    name: Resolve Target
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      deploy_environment: ${{ steps.resolve.outputs.deploy_environment }}
      tf_working_dir: ${{ steps.resolve.outputs.tf_working_dir }}
      should_apply: ${{ steps.resolve.outputs.should_apply }}
    steps:
      - name: Resolve deployment target
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DEPLOY_ENV="${{ inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/stable" ]; then
            DEPLOY_ENV="production"
          elif [ "${{ github.ref }}" = "refs/heads/martin" ]; then
            DEPLOY_ENV="martin"
          elif [ "${{ github.ref }}" = "refs/heads/benoit" ]; then
            DEPLOY_ENV="benoit"
          elif [ "${{ github.ref }}" = "refs/heads/charlie" ]; then
            DEPLOY_ENV="charlie"
          else
            DEPLOY_ENV="staging"
          fi

          echo "deploy_environment=${DEPLOY_ENV}" >> "$GITHUB_OUTPUT"
          echo "tf_working_dir=terraform" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SHOULD_APPLY="false"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHOULD_APPLY="true"
          elif [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/stable" ] || \
               [ "${{ github.ref }}" = "refs/heads/martin" ] || [ "${{ github.ref }}" = "refs/heads/benoit" ] || \
               [ "${{ github.ref }}" = "refs/heads/charlie" ]; then
            SHOULD_APPLY="true"
          else
            SHOULD_APPLY="false"
          fi
          echo "should_apply=${SHOULD_APPLY}" >> "$GITHUB_OUTPUT"

  check-secrets:
    name: Check Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [resolve-target]
    environment: ${{ needs.resolve-target.outputs.deploy_environment }}
    outputs:
      has-secrets: ${{ steps.check.outputs.has-secrets }}
    steps:
      - name: Check if secrets are configured
        id: check
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.R2_ACCESS_KEY_ID }}" ]; then
            echo "has-secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has-secrets=false" >> $GITHUB_OUTPUT
            echo "::notice::Terraform plan/apply skipped - secrets not configured for environment '${{ needs.resolve-target.outputs.deploy_environment }}'. See docs/GETTING_STARTED.md for setup instructions."
          fi

  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check-secrets, resolve-target]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: |
          if ! terraform fmt -check -recursive; then
            echo "::warning::Terraform formatting issues found. Run 'terraform fmt -recursive terraform/' to fix."
          fi
        working-directory: terraform

      - name: Terraform Init
        id: init
        run: |
          terraform init -backend=false
        working-directory: ${{ needs.resolve-target.outputs.tf_working_dir }}

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: ${{ needs.resolve-target.outputs.tf_working_dir }}

      - name: Post Validation Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const hasSecrets = '${{ needs.check-secrets.outputs.has-secrets }}' === 'true';
            const deployEnvironment = '${{ needs.resolve-target.outputs.deploy_environment }}';
            const planNote = hasSecrets
              ? ''
              : `\n\n> **Note:** Terraform plan was skipped because secrets are not configured for the \`${deployEnvironment}\` environment. This is expected for external contributors. See [docs/GETTING_STARTED.md](docs/GETTING_STARTED.md) for setup instructions.`;

            const output = `### Terraform Validation Results

            **Target environment:** \`${deployEnvironment}\`

            | Step | Status |
            |------|--------|
            | Format | ${{ steps.fmt.outcome == 'success' && '✅' || '⚠️' }} |
            | Init | ${{ steps.init.outcome == 'success' && '✅' || '❌' }} |
            | Validate | ${{ steps.validate.outcome == 'success' && '✅' || '❌' }} |
            ${planNote}

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              });
            } catch (error) {
              if (error.status === 403) {
                core.notice('Could not post PR comment — GITHUB_TOKEN has read-only access (expected for fork PRs).');
              } else {
                throw error;
              }
            }

  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validate, check-secrets, resolve-target]
    if: github.event_name == 'pull_request' && needs.check-secrets.outputs.has-secrets == 'true'
    environment: ${{ needs.resolve-target.outputs.deploy_environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build worker packages
        run: |
          npm run build -w @open-inspect/shared
          npm run build -w @open-inspect/control-plane
          npm run build -w @open-inspect/slack-bot
          npm run build -w @open-inspect/github-bot
          npm run build -w @open-inspect/linear-bot

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="access_key=${{ secrets.R2_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            -backend-config='endpoints={s3="https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"}' \
            -backend-config="key=${{ needs.resolve-target.outputs.deploy_environment }}/terraform.tfstate"
        working-directory: ${{ needs.resolve-target.outputs.tf_working_dir }}

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
          echo "plan<<EOF" >> $GITHUB_OUTPUT
          cat plan_output.txt | head -c 60000 >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        working-directory: ${{ needs.resolve-target.outputs.tf_working_dir }}
        continue-on-error: true
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_worker_subdomain: ${{ vars.CLOUDFLARE_WORKER_SUBDOMAIN }}
          TF_VAR_vercel_api_token: "${{ secrets.VERCEL_API_TOKEN || '000000000000000000000000' }}"
          TF_VAR_vercel_team_id: "${{ vars.VERCEL_TEAM_ID || 'unused' }}"
          TF_VAR_modal_token_id: ${{ secrets.MODAL_TOKEN_ID }}
          TF_VAR_modal_token_secret: ${{ secrets.MODAL_TOKEN_SECRET }}
          TF_VAR_modal_workspace: ${{ vars.MODAL_WORKSPACE }}
          TF_VAR_modal_environment: ${{ needs.resolve-target.outputs.deploy_environment == 'production' && 'main' || needs.resolve-target.outputs.deploy_environment }}
          TF_VAR_modal_environment_web_suffix: ${{ secrets.MODAL_ENVIRONMENT_WEB_SUFFIX }}
          TF_VAR_github_client_id: ${{ vars.GH_OAUTH_CLIENT_ID }}
          TF_VAR_github_client_secret: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          TF_VAR_github_app_id: ${{ vars.GH_APP_ID }}
          TF_VAR_github_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          TF_VAR_github_app_installation_id: ${{ vars.GH_APP_INSTALLATION_ID }}
          TF_VAR_enable_slack_bot: "${{ secrets.ENABLE_SLACK_BOT || 'true' }}"
          TF_VAR_slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          TF_VAR_slack_signing_secret: ${{ secrets.SLACK_SIGNING_SECRET }}
          TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_token_encryption_key: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          TF_VAR_repo_secrets_encryption_key: ${{ secrets.REPO_SECRETS_ENCRYPTION_KEY }}
          TF_VAR_internal_callback_secret: ${{ secrets.INTERNAL_CALLBACK_SECRET }}
          TF_VAR_nextauth_secret: ${{ secrets.NEXTAUTH_SECRET }}
          TF_VAR_modal_api_secret: ${{ secrets.MODAL_API_SECRET }}
          TF_VAR_allowed_users: ${{ vars.ALLOWED_USERS }}
          TF_VAR_allowed_email_domains: ${{ vars.ALLOWED_EMAIL_DOMAINS }}
          TF_VAR_deployment_name: ${{ vars.DEPLOYMENT_NAME }}
          TF_VAR_enable_github_bot: "${{ vars.ENABLE_GITHUB_BOT || 'false' }}"
          TF_VAR_github_webhook_secret: ${{ secrets.GH_WEBHOOK_SECRET }}
          TF_VAR_github_bot_username: ${{ vars.GH_BOT_USERNAME }}
          TF_VAR_app_name: "${{ secrets.APP_NAME || 'Open-Inspect' }}"
          TF_VAR_app_short_name: ${{ secrets.APP_SHORT_NAME }}
          TF_VAR_app_icon_url: ${{ secrets.APP_ICON_URL }}
          TF_VAR_enable_linear_bot: "${{ vars.ENABLE_LINEAR_BOT || 'false' }}"
          TF_VAR_linear_client_id: ${{ vars.LINEAR_CLIENT_ID }}
          TF_VAR_linear_client_secret: ${{ secrets.LINEAR_CLIENT_SECRET }}
          TF_VAR_linear_webhook_secret: ${{ secrets.LINEAR_WEBHOOK_SECRET }}
          TF_VAR_web_platform: "${{ vars.WEB_PLATFORM || 'cloudflare' }}"
          TF_VAR_cloudflare_web_app_url: ${{ vars.CLOUDFLARE_WEB_APP_URL }}
          TF_VAR_enable_durable_object_bindings: "${{ vars.ENABLE_DURABLE_OBJECT_BINDINGS || 'true' }}"
          TF_VAR_enable_service_bindings: "${{ vars.ENABLE_SERVICE_BINDINGS || 'true' }}"
          TF_VAR_sandbox_provider: "${{ vars.SANDBOX_PROVIDER || 'modal' }}"
          TF_VAR_daytona_api_url: ${{ secrets.DAYTONA_API_URL }}
          TF_VAR_daytona_api_key: ${{ secrets.DAYTONA_API_KEY }}
          TF_VAR_daytona_base_snapshot: ${{ secrets.DAYTONA_BASE_SNAPSHOT }}
          TF_VAR_daytona_target: ${{ secrets.DAYTONA_TARGET }}
          TF_VAR_langfuse_public_key: ${{ vars.LANGFUSE_PUBLIC_KEY }}
          TF_VAR_langfuse_secret_key: ${{ secrets.LANGFUSE_SECRET_KEY }}
          TF_VAR_langfuse_baseurl: ${{ vars.LANGFUSE_BASEURL }}
          TF_VAR_cf_access_client_id: ${{ vars.CF_ACCESS_CLIENT_ID }}
          TF_VAR_cf_access_client_secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          TF_VAR_cf_access_token_url: ${{ vars.CF_ACCESS_TOKEN_URL }}
          TF_VAR_reef_alias_enabled: "${{ needs.resolve-target.outputs.deploy_environment == 'production' && 'true' || 'false' }}"

      - name: Post Plan Results
        uses: actions/github-script@v8
        with:
          script: |
            const planOutcome = '${{ steps.plan.outcome }}';
            const plan = `${{ steps.plan.outputs.plan }}`;
            const deployEnvironment = '${{ needs.resolve-target.outputs.deploy_environment }}';

            const truncatedPlan = plan.length > 60000
              ? plan.substring(0, 60000) + '\n... (truncated)'
              : plan;

            const output = `### Terraform Plan Results

            **Target environment:** \`${deployEnvironment}\`
            **Status:** ${planOutcome === 'success' ? '✅ Success' : '❌ Failed'}

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${truncatedPlan}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    name: Apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate, check-secrets, resolve-target]
    if: needs.resolve-target.outputs.should_apply == 'true' && needs.check-secrets.outputs.has-secrets == 'true'
    environment: ${{ needs.resolve-target.outputs.deploy_environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build worker packages
        run: |
          npm run build -w @open-inspect/shared
          npm run build -w @open-inspect/control-plane
          npm run build -w @open-inspect/slack-bot
          npm run build -w @open-inspect/github-bot
          npm run build -w @open-inspect/linear-bot

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install Modal and Python dependencies
        run: uv sync --frozen
        working-directory: packages/modal-infra

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="access_key=${{ secrets.R2_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            -backend-config='endpoints={s3="https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"}' \
            -backend-config="key=${{ needs.resolve-target.outputs.deploy_environment }}/terraform.tfstate"
        working-directory: ${{ needs.resolve-target.outputs.tf_working_dir }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ${{ needs.resolve-target.outputs.tf_working_dir }}
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_worker_subdomain: ${{ vars.CLOUDFLARE_WORKER_SUBDOMAIN }}
          TF_VAR_vercel_api_token: "${{ secrets.VERCEL_API_TOKEN || '000000000000000000000000' }}"
          TF_VAR_vercel_team_id: "${{ vars.VERCEL_TEAM_ID || 'unused' }}"
          TF_VAR_modal_token_id: ${{ secrets.MODAL_TOKEN_ID }}
          TF_VAR_modal_token_secret: ${{ secrets.MODAL_TOKEN_SECRET }}
          TF_VAR_modal_workspace: ${{ vars.MODAL_WORKSPACE }}
          TF_VAR_modal_environment: ${{ needs.resolve-target.outputs.deploy_environment == 'production' && 'main' || needs.resolve-target.outputs.deploy_environment }}
          TF_VAR_modal_environment_web_suffix: ${{ secrets.MODAL_ENVIRONMENT_WEB_SUFFIX }}
          TF_VAR_github_client_id: ${{ vars.GH_OAUTH_CLIENT_ID }}
          TF_VAR_github_client_secret: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          TF_VAR_github_app_id: ${{ vars.GH_APP_ID }}
          TF_VAR_github_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          TF_VAR_github_app_installation_id: ${{ vars.GH_APP_INSTALLATION_ID }}
          TF_VAR_enable_slack_bot: "${{ vars.ENABLE_SLACK_BOT || 'false' }}"
          TF_VAR_slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          TF_VAR_slack_signing_secret: ${{ secrets.SLACK_SIGNING_SECRET }}
          TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_token_encryption_key: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          TF_VAR_repo_secrets_encryption_key: ${{ secrets.REPO_SECRETS_ENCRYPTION_KEY }}
          TF_VAR_internal_callback_secret: ${{ secrets.INTERNAL_CALLBACK_SECRET }}
          TF_VAR_nextauth_secret: ${{ secrets.NEXTAUTH_SECRET }}
          TF_VAR_modal_api_secret: ${{ secrets.MODAL_API_SECRET }}
          TF_VAR_allowed_users: ${{ vars.ALLOWED_USERS }}
          TF_VAR_allowed_email_domains: ${{ vars.ALLOWED_EMAIL_DOMAINS }}
          TF_VAR_deployment_name: ${{ vars.DEPLOYMENT_NAME }}
          TF_VAR_enable_github_bot: "${{ vars.ENABLE_GITHUB_BOT || 'false' }}"
          TF_VAR_github_webhook_secret: ${{ secrets.GH_WEBHOOK_SECRET }}
          TF_VAR_github_bot_username: ${{ vars.GH_BOT_USERNAME }}
          TF_VAR_app_name: "${{ secrets.APP_NAME || 'Open-Inspect' }}"
          TF_VAR_app_short_name: ${{ secrets.APP_SHORT_NAME }}
          TF_VAR_app_icon_url: ${{ secrets.APP_ICON_URL }}
          TF_VAR_enable_linear_bot: "${{ vars.ENABLE_LINEAR_BOT || 'false' }}"
          TF_VAR_linear_client_id: ${{ vars.LINEAR_CLIENT_ID }}
          TF_VAR_linear_client_secret: ${{ secrets.LINEAR_CLIENT_SECRET }}
          TF_VAR_linear_webhook_secret: ${{ secrets.LINEAR_WEBHOOK_SECRET }}
          TF_VAR_web_platform: "${{ vars.WEB_PLATFORM || 'cloudflare' }}"
          TF_VAR_cloudflare_web_app_url: ${{ vars.CLOUDFLARE_WEB_APP_URL }}
          TF_VAR_enable_durable_object_bindings: "${{ vars.ENABLE_DURABLE_OBJECT_BINDINGS || 'true' }}"
          TF_VAR_enable_service_bindings: "${{ vars.ENABLE_SERVICE_BINDINGS || 'true' }}"
          TF_VAR_sandbox_provider: "${{ vars.SANDBOX_PROVIDER || 'modal' }}"
          TF_VAR_daytona_api_url: ${{ secrets.DAYTONA_API_URL }}
          TF_VAR_daytona_api_key: ${{ secrets.DAYTONA_API_KEY }}
          TF_VAR_daytona_base_snapshot: ${{ secrets.DAYTONA_BASE_SNAPSHOT }}
          TF_VAR_daytona_target: ${{ secrets.DAYTONA_TARGET }}
          TF_VAR_langfuse_public_key: ${{ vars.LANGFUSE_PUBLIC_KEY }}
          TF_VAR_langfuse_secret_key: ${{ secrets.LANGFUSE_SECRET_KEY }}
          TF_VAR_langfuse_baseurl: ${{ vars.LANGFUSE_BASEURL }}
          TF_VAR_cf_access_client_id: ${{ vars.CF_ACCESS_CLIENT_ID }}
          TF_VAR_cf_access_client_secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          TF_VAR_cf_access_token_url: ${{ vars.CF_ACCESS_TOKEN_URL }}
          TF_VAR_reef_alias_enabled: "${{ needs.resolve-target.outputs.deploy_environment == 'production' && 'true' || 'false' }}"

      - name: Post Apply Results
        if: always()
        run: |
          echo "### Terraform Apply Results"
          echo "Status: ${{ job.status }}"
          echo "Commit: ${{ github.sha }}"
          echo "Environment: ${{ needs.resolve-target.outputs.deploy_environment }}"
          echo "Terraform directory: ${{ needs.resolve-target.outputs.tf_working_dir }}"
          echo "Applied by: ${{ github.actor }}"
